[project]
name = "hexpress-mcp"
version = "0.1.0"
description = "MCP server for NUMECA HEXPRESS/Hybrid 10.1 mesh generation: batch conf files, -batch -script Python automation, file conversion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GalliumChen" }]
keywords = ["mcp", "model-context-protocol", "hexpress", "numeca", "cfd", "mesh-generation", "hexahedral-mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
hexpress-mcp = "hexpress_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "SIM", "RUF", "PLW", "S110"]
ignore = ["RUF002", "RUF003"]  # fullwidth punctuation is intentional in this bilingual project

[tool.ruff.lint.per-file-ignores]
# MCP tool wrappers intentionally catch everything and convert to a JSON error
# payload — a crashed tool must never take down the stdio server.
"src/hexpress_mcp/server.py" = ["BLE001", "PLW1510"]
# install probing intentionally swallows all errors (missing dirs, cache)
"src/hexpress_mcp/config.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
