name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system fastmcp pytest ruff

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Selftest (reports missing HEXPRESS gracefully on CI runners)
        run: python -m hexpress_mcp --selftest
        continue-on-error: true
